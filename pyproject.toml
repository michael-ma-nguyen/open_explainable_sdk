[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dakma-sdk"
version = "1.1.0"
description = "Explainability SDK for ML lifecycle tracking and auditable decisions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Anupiya Nugaliyadde" }]
keywords = ["explainability", "ml", "governance", "audit", "shap", "xai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.22",
]

[project.urls]
Homepage = "https://github.com/dakmaai/open_explainable_sdk"
Repository = "https://github.com/dakmaai/open_explainable_sdk"
Issues = "https://github.com/dakmaai/open_explainable_sdk/issues"
Documentation = "https://github.com/dakmaai/open_explainable_sdk#readme"

[project.optional-dependencies]
ml = [
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "xgboost>=1.7",
  "shap>=0.44",
]
dl = [
  "torch>=2.0",
  "captum>=0.6",
]
dev = [
  "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "smoke: end-to-end example script smoke tests (needs optional deps)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dakma", "dakma_sdk"]
